      </select>
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn live-btn" data-view="live"><span class="live-dot"></span> Live</button>
        <button class="view-btn active" data-view="schedule">Spielplan</button>
        <button class="view-btn" data-view="table">Tabelle</button>
      </div>
    </div>
    <div class="header-actions">
      <button class="refresh-btn theme-btn" id="btnTheme" type="button" title="Dunkles Design einschalten"
        aria-label="Dunkles Design einschalten">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <button class="refresh-btn" id="btnRefresh" type="button" title="Aktualisieren"
        aria-label="Aktualisieren">↻</button>
    </div>
  </header>

  <nav class="matchday-nav" id="navMD">
    <div class="matchday-tabs" id="tabsMD"><span class="md-label">Spieltag</span></div>
  </nav>

  <main class="content">
    <div id="viewSchedule">
      <div class="card">
        <div class="state-msg" id="loadingSch">
          <div class="spinner"></div><span>Spielplan wird geladen…</span>
        </div>
      </div>
    </div>
    <div id="viewLive" class="hidden"></div>
    <div id="viewTable" class="hidden"></div>
  </main>

  <footer class="footer">
    <div>Daten bereitgestellt von <a href="https://www.thesportsdb.com" target="_blank"
        rel="noopener">TheSportsDB</a></div>
  </footer>

  <script>
    // ━━━ Liga-Konfiguration ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // tsdb: Liga-ID bei TheSportsDB und Anzahl Spieltage.
    // code: kurzer Liga-Code für geteilte Links (#g=<code>t<Spiel-ID>).
    const LEAGUES = {
      frauen1: { code: 'f1', tsdb: { id: 5204, rounds: 26 }, label: '1. Liga', fullLabel: 'Frauen-Bundesliga', title: '⚽ Frauen-Bundesliga', gender: 'frauen' },
      maenner1: { code: 'm1', tsdb: { id: 4331, rounds: 34 }, label: '1. Liga', fullLabel: 'Bundesliga', title: '⚽ Bundesliga', gender: 'maenner' },
      maenner2: { code: 'm2', tsdb: { id: 4399, rounds: 34 }, label: '2. Liga', fullLabel: '2. Bundesliga', title: '⚽ 2. Bundesliga', gender: 'maenner' },
      maenner3: { code: 'm3', tsdb: { id: 4639, rounds: 38 }, label: '3. Liga', fullLabel: '3. Liga', title: '⚽ 3. Liga', gender: 'maenner' },
      wsl: { code: 'wsl', tsdb: { id: 4849, rounds: 26 }, label: 'WSL', fullLabel: "Women's Super League", title: "⚽ Women's Super League", gender: 'frauen' },
      premiereligue: { code: 'pl', tsdb: { id: 5203, rounds: 22 }, label: 'Première Ligue', fullLabel: 'Première Ligue', title: '⚽ Première Ligue', gender: 'frauen' },
      // Pokalwettbewerbe: rounds = Spieltage der Ligaphase, danach K.-o.-Runden (CUP_ROUNDS).
      ucl: { code: 'cl', tsdb: { id: 4480, rounds: 8 }, cup: true, label: 'CL', fullLabel: 'Champions League', title: '⚽ Champions League', gender: 'maenner' },
      laliga: { code: 'll', tsdb: { id: 4335, rounds: 38 }, label: 'La Liga', fullLabel: 'La Liga (Spanien)', title: '⚽ La Liga', gender: 'maenner' },
      uwcl: { code: 'wcl', tsdb: { id: 4889, rounds: 6 }, cup: true, label: 'CL', fullLabel: 'Champions League der Frauen', title: '⚽ Champions League der Frauen', gender: 'frauen' },
      // Nationalmannschaften: letzte und nächste Spiele über alle Wettbewerbe.
      natm: { code: 'nm', tsdb: { id: null, rounds: 0 }, team: 133907, label: 'DFB', fullLabel: 'Nationalmannschaft', title: '⚽ Nationalmannschaft', gender: 'maenner' },
      natf: { code: 'nf', tsdb: { id: null, rounds: 0 }, team: 136805, label: 'DFB', fullLabel: 'Nationalmannschaft der Frauen', title: '⚽ Nationalmannschaft der Frauen', gender: 'frauen' },
      // Spiele aller mit Stern markierten Teams. Geteilt wird das Spiel seiner
      // Liga (matchRow übergibt sie über leagueKey), daher ohne eigenen Code.
      meine: { tsdb: { id: null, rounds: 0 }, favorites: true, label: 'Meine Spiele', fullLabel: 'Meine Spiele', title: '⭐ Meine Spiele', gender: 'frauen' },
      // Alle Spiele eines Vereins (Klick auf einen Vereinsnamen). Verein und
      // Liga stehen in S.club; Titel, Sportart und Geschlecht setzt openClub.
      verein: { tsdb: { id: null, rounds: 0 }, club: true, label: 'Verein', fullLabel: 'Verein', title: '⚽ Verein', gender: 'maenner' },
      handball1: { code: 'hb', tsdb: { id: 4533, rounds: 34 }, sport: 'handball', label: '1. Liga', fullLabel: 'Handball-Bundesliga', title: '🤾 Handball-Bundesliga', gender: 'maenner' },
    };

    // Spielzeiten je Sportart: Halbzeitlänge, Pause und wie lange ein Spiel
    // nach Anpfiff ohne Live-Daten als laufend gilt (inkl. Nachspielzeit bzw.
    // angehaltener Uhr bei Auszeiten im Handball).
    const SPORTS = {
      fussball: { half: 45, pause: 15, durMin: 130, goalDetails: true },
      handball: { half: 30, pause: 15, durMin: 95, goalDetails: false },
    };
    function sportCfg(lk) { return SPORTS[leagueCfg(lk).sport || 'fussball']; }
    function matchDurMs(lk) { return sportCfg(lk).durMin * 60000; }
    // Spieldauer eines konkreten Spiels (in "Meine Spiele" mischen sich Sportarten).
    function durOf(m) { return m.durMs ?? matchDurMs(); }
    // Listenansichten ohne Spieltage und Tabelle.
    function isListView(lk) { const l = leagueCfg(lk); return !!(l.team || l.favorites || l.club); }
    // Rundennummern bei TheSportsDB für Pokalwettbewerbe (aus der Saison 2025/26
    // der Champions League abgelesen). 400 und 0 sind Qualifikation/Play-off.
    const CUP_ROUNDS = {
      32: { short: 'PO', long: 'K.-o.-Play-offs', order: 101 },
      16: { short: 'AF', long: 'Achtelfinale', order: 102 },
      125: { short: 'VF', long: 'Viertelfinale', order: 103 },
      150: { short: 'HF', long: 'Halbfinale', order: 104 },
      200: { short: 'F', long: 'Finale', order: 105 },
    };
    // Nationalmannschaften: zwei Reiter statt Spieltagen.
    const TEAM_ROUNDS = { 1: { short: 'Zuletzt', long: 'Letzte Spiele' }, 2: { short: 'Demnächst', long: 'Nächste Spiele' } };
    function roundInfo(n, lk) {
      const l = leagueCfg(lk);
      if (isListView(lk) && TEAM_ROUNDS[n]) return TEAM_ROUNDS[n];
      if (l.cup && CUP_ROUNDS[n]) return CUP_ROUNDS[n];
      return { short: String(n), long: `${n}. Spieltag` };
    }
    function roundOrder(n) { const c = leagueCfg().cup && CUP_ROUNDS[n]; return c ? c.order : n; }
    function roundLabel() { const l = leagueCfg(); return isListView() ? 'Spiele' : l.cup ? 'Runde' : 'Spieltag'; }

    function isFootball() { return (leagueCfg().sport || 'fussball') === 'fussball'; }

    const LIVE_POLL_MS = 60000;

    const NOW = new Date();
    const SEASON = NOW.getMonth() >= 7 ? NOW.getFullYear() : NOW.getFullYear() - 1;

    const TSDB_API = 'https://api.ligazeit.de/v1';
    const TSDB_LIVE_API = 'https://api.ligazeit.de/v2/livescore/';
    const TSDB_SEASON_REFRESH_MS = 10 * 60000;
    const TSDB_SEASON = `${SEASON}-${SEASON + 1}`;

    // ━━━ State ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const S = {
      league: 'maenner1', matches: [], mdays: {}, order: [], cur: 1, sel: 1,
      table: null, view: 'schedule', lastUpdate: null, pollTimer: null,
      openMatches: new Set(),  // IDs aufgeklappter Spiele, überlebt Neu-Rendern
      goalCache: new Map(),    // TheSportsDB: Spielverlauf je Spiel und Spielstand
      live: new Map(),         // Livescore je Spiel (idEvent)
      seasonLoadedAt: 0,       // Zeitpunkt der letzten Saisonabfrage
      tableNote: '',
      club: null,              // Vereinsansicht: { lk, id, name, back }
      share: null              // geteiltes Spiel aus einem Link: { lk, mid, scrolled }
    };

    // ━━━ Helpers ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    const $ = id => document.getElementById(id);

    function leagueCfg(lk = S.league) { return LEAGUES[lk] || LEAGUES.maenner1; }

    // ━━━ TheSportsDB-Adapter ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // Wandelt TheSportsDB-Daten in eine einheitliche Spiel-Form um.
    async function tsdb(path) {
      const r = await fetch(TSDB_API + path);
      if (r.status === 429) throw new Error('Zu viele Anfragen – bitte in einer Minute erneut versuchen');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();       // leere Antwort = keine Daten
      return text.trim() ? JSON.parse(text) : {};
    }

    function tsdbList(j, key) { const v = j && j[key]; return Array.isArray(v) ? v : []; }
    function tsdbLeagueId(lk) { return String(leagueCfg(lk).tsdb.id); }
    function tsdbOwn(e, lk) { return e && String(e.idLeague) === tsdbLeagueId(lk); }

    const TSDB_FINISHED = new Set(['match finished', 'ft', 'aet', 'pen', 'after extra time', 'after penalties', 'awarded', 'aw', 'wo']);
    const TSDB_OFF = { postponed: 'Verlegt', pst: 'Verlegt', cancelled: 'Abgesagt', canc: 'Abgesagt', abandoned: 'Abgebrochen', abd: 'Abgebrochen', suspended: 'Unterbrochen', susp: 'Unterbrochen' };

    // strTimestamp ist UTC, meist ohne Zeitzonenangabe.
    function tsdbTime(e) {
      let t = e.strTimestamp || (e.dateEvent && e.strTime ? `${e.dateEvent}T${e.strTime}` : e.dateEvent);
      if (!t) return null;
      t = String(t).trim().replace(' ', 'T');
      if (/^\d{4}-\d{2}-\d{2}$/.test(t)) t += 'T12:00:00';
      if (!/(Z|[+-]\d{2}:?\d{2})$/.test(t)) t += 'Z';
      const d = new Date(t);
      return isNaN(d) ? null : d.toISOString();
    }

    function tsdbScore(v) {
      if (v === null || v === undefined || v === '') return null;
      const n = Number(v);
      return Number.isInteger(n) && n >= 0 && n < 100 ? n : null;
    }

    // Wappen in 50 px statt Original (bis 720 px).
    function tsdbBadge(u) {
      const x = safeUrl(u);
      return x ? x.replace(/\/(tiny|small|medium)$/, '') + '/tiny' : '';
    }

    function tsdbMatch(e, groupOverride, lk) {
      const id = Number(e.idEvent), when = tsdbTime(e);
      const round = groupOverride ?? Number(e.intRound);
      if (!Number.isInteger(id) || !Number.isInteger(round) || round < 1 || !when) return null;
      const status = String(e.strStatus || '').trim().toLowerCase();
      const s1 = tsdbScore(e.intHomeScore), s2 = tsdbScore(e.intAwayScore);
      const hasScore = s1 !== null && s2 !== null;
      const offLabel = TSDB_OFF[status] || (String(e.strPostponed || '').toLowerCase() === 'yes' ? 'Verlegt' : '');
      const finished = !offLabel && (TSDB_FINISHED.has(status)
        || (!status && hasScore && Date.now() - Date.parse(when) > matchDurMs(lk)));
      return {
        matchID: id, matchDateTime: when,
        matchIsFinished: finished, seasonFinished: finished, matchIsOff: !!offLabel, offLabel,
        team1: { teamId: Number(e.idHomeTeam), teamName: e.strHomeTeam, shortName: e.strHomeTeam, teamIconUrl: tsdbBadge(e.strHomeTeamBadge) },
        team2: { teamId: Number(e.idAwayTeam), teamName: e.strAwayTeam, shortName: e.strAwayTeam, teamIconUrl: tsdbBadge(e.strAwayTeamBadge) },
        matchResults: hasScore ? [{ resultOrderID: 2, pointsTeam1: s1, pointsTeam2: s2 }] : [],
        group: { groupOrderID: round, groupName: roundInfo(round, lk).long },
        competition: e.strLeague || '', durMs: matchDurMs(lk),
        goals: null
      };
    }

    function tsdbMatches(events, lk) {
      const matches = events.filter(e => tsdbOwn(e, lk)).map(e => tsdbMatch(e, undefined, lk)).filter(Boolean);
      return leagueCfg(lk).cup ? cupMainPhase(matches, lk) : matches;
    }

    // Pokal: nur Ligaphase und K.-o.-Runden. In der laufenden Saison führt
    // TheSportsDB die Qualifikation noch als Runde 0–3 (erst später als 400);
    // diese Spiele liegen Wochen vor den gleich nummerierten Ligaspieltagen und
    // werden über den zeitlichen Abstand aussortiert.
    function cupMainPhase(matches, lk) {
      const phase = leagueCfg(lk).tsdb.rounds;
      const keep = matches.filter(m => {
        const r = m.group.groupOrderID;
        return (r >= 1 && r <= phase) || CUP_ROUNDS[r];
      });
      const latest = {};
      for (const m of keep) {
        const r = m.group.groupOrderID, t = Date.parse(m.matchDateTime);
        latest[r] = Math.max(latest[r] || 0, t);
      }
      return keep.filter(m => Date.parse(m.matchDateTime) >= latest[m.group.groupOrderID] - 21 * 864e5);
    }

    // Nationalmannschaft: letzte und nächste Spiele, unabhängig vom Wettbewerb.
    async function tsdbLoadTeam(lk, teamId) {
      const id = teamId ?? leagueCfg(lk).team;
      const [last, next] = await Promise.all([
        tsdb(`/eventslast.php?id=${id}`), tsdb(`/eventsnext.php?id=${id}`)]);
      const seen = new Set(), out = [];
      for (const e of [...tsdbList(last, 'results'), ...tsdbList(next, 'events')]) {
        if (seen.has(e.idEvent)) continue;
        seen.add(e.idEvent);
        const m = tsdbMatch(e, 1, lk);
        if (!m) continue;
        // Nach Datum einsortieren: TheSportsDB führt Spiele ohne eingetragenes
        // Ergebnis teils monatelang als "nächste Spiele".
        const r = m.matchIsFinished || Date.parse(m.matchDateTime) + durOf(m) < Date.now() ? 1 : 2;
        m.group = { groupOrderID: r, groupName: TEAM_ROUNDS[r].long };
        m.listView = true;
        out.push(m);
      }
      return out;
    }

    // Komplette Saison laden.
    async function tsdbLoadSeason(lk) {
      const j = await tsdb(`/eventsseason.php?id=${tsdbLeagueId(lk)}&s=${TSDB_SEASON}`);
      return tsdbMatches(tsdbList(j, 'events'), lk);
    }

    // Saison laden und Zeitpunkt merken.
    async function tsdbReloadSeason() {
      const matches = await tsdbLoadSeason();
      S.seasonLoadedAt = Date.now();
      return matches;
    }

    const TSDB_LIVE_ENDED = new Set(['ft', 'aet', 'pen', 'match finished', 'after extra time', 'after penalties']);
    const TSDB_LIVE_PENDING = new Set(['', 'ns', 'not started', 'tbd']);

    // Livescores der Liga in S.live übernehmen. Liefert true, wenn ein bisher
    // laufendes Spiel nicht mehr im Feed steht; dann sollte die Saison neu
    // geladen werden, damit das Endergebnis aus den regulären Daten kommt.
    async function tsdbLoadLive() {
      const r = await fetch(TSDB_LIVE_API + tsdbLeagueId());
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      const feed = tsdbList(text.trim() ? JSON.parse(text) : {}, 'livescore').filter(tsdbOwn);
      const seen = new Set();
      for (const e of feed) {
        const id = Number(e.idEvent);
        if (!Number.isInteger(id)) continue;
        const status = String(e.strStatus || '').trim().toLowerCase();
        const progress = String(e.strProgress ?? '').trim();
        seen.add(id);
        S.live.set(id, {
          s1: tsdbScore(e.intHomeScore), s2: tsdbScore(e.intAwayScore), status,
          minute: /^\d{1,3}(\+\d{1,2})?$/.test(progress) ? progress : '',
          ended: TSDB_LIVE_ENDED.has(status)
        });
      }
      let dropped = false;
      for (const [id, v] of S.live) {
        if (!seen.has(id) && !v.ended) { v.ended = true; dropped = true; }
      }
      return dropped;
    }

    // Livescore auf ein Spiel anwenden. Ist das Spiel laut Saisondaten
    // beendet, haben die regulären Daten Vorrang und der Eintrag entfällt.
    function applyLive(m) {
      const id = Number(m.matchID), v = S.live.get(id);
      m.liveStatus = ''; m.liveMinute = '';
      if (!v) return;
      if (v.ended && m.seasonFinished) { S.live.delete(id); return; }
      if (v.s1 !== null && v.s2 !== null) {
        m.matchResults = [{ resultOrderID: 2, pointsTeam1: v.s1, pointsTeam2: v.s2 }];
      }
      if (v.ended) { m.matchIsFinished = true; return; }
      if (TSDB_LIVE_PENDING.has(v.status)) return;
      m.matchIsFinished = false;
      m.liveStatus = v.status;
      m.liveMinute = v.minute;
    }

    // Aktueller Spieltag: der des frühesten laufenden oder kommenden Spiels.
    function tsdbCurrentRound(fallback) {
      const now = Date.now();
      const next = S.matches
        .filter(m => !m.matchIsFinished && !m.matchIsOff && Date.parse(m.matchDateTime) + durOf(m) > now)
        .sort((a, b) => Date.parse(a.matchDateTime) - Date.parse(b.matchDateTime))[0];
      return next ? next.group.groupOrderID : (fallback ?? S.order[S.order.length - 1] ?? 1);
    }

    // Spielverlauf aus der Timeline.
    // Annahme: strHome bezeichnet das Team der Spielerin/des Spielers, ein
    // Eigentor zählt also für das andere Team.
    function scoreKey(m) {
      const r = finalResult(m);
      return r ? `${r.pointsTeam1}:${r.pointsTeam2}` : '-';
    }

    // TheSportsDB trägt Tore teils erst Minuten nach Spielende nach. Ein
    // unvollständiges Ergebnis wird nach GOALS_RETRY_MS erneut abgefragt.
    const GOALS_RETRY_MS = 3 * 60000;
    const goalsInFlight = new Set();

    // TheSportsDB-Timeline in das Tor-Format der App umwandeln.
    // Annahme: strHome bezeichnet das Team der Spielerin/des Spielers, ein
    // Eigentor zählt also für das andere Team.
    async function tsdbTimelineGoals(id) {
      const j = await tsdb(`/lookuptimeline.php?id=${id}`);
      let a = 0, b = 0;
      return tsdbList(j, 'timeline')
        .filter(t => /goal/i.test(t.strTimeline || '') && !/miss/i.test(t.strTimelineDetail || ''))
        .sort((x, y) => (Number(x.intTime) || 0) - (Number(y.intTime) || 0))
        .map(t => {
          const detail = String(t.strTimelineDetail || '');
          const own = /own/i.test(detail);
          const home = String(t.strHome || '').toLowerCase() === 'yes';
          if (own ? !home : home) a++; else b++;
          const min = Number(t.intTime);
          return {
            scoreTeam1: a, scoreTeam2: b,
            matchMinute: Number.isInteger(min) ? min : null,
            goalGetterName: t.strPlayer || '',
            isPenalty: /pen/i.test(detail), isOwnGoal: own, isOvertime: false
          };
        });
    }

    async function tsdbLoadGoals(m) {
      const id = Number(m.matchID), key = scoreKey(m);
      if (goalsInFlight.has(id)) return;
      goalsInFlight.add(id);
      let goals = null;
      try { goals = await tsdbTimelineGoals(id); } catch (e) { }
      const r = finalResult(m);
      const total = r ? (Number(r.pointsTeam1) || 0) + (Number(r.pointsTeam2) || 0) : 0;
      const entry = goals
        ? { key, goals, error: false, incomplete: goals.length < total, at: Date.now() }
        : { key, goals: [], error: true, incomplete: true, at: Date.now() };
      S.goalCache.set(id, entry);
      // Auf das aktuelle Spielobjekt anwenden (kann durch Refresh ersetzt sein)
      for (const x of S.matches) if (Number(x.matchID) === id) applyGoalCache(x);
      goalsInFlight.delete(id);
      const row = $('viewSchedule').querySelector(`.match-row[data-mid="${id}"]`);
      const cur = S.matches.find(x => Number(x.matchID) === id);
      if (row && cur && S.openMatches.has(id)) {
        const next = row.nextElementSibling;
        if (next && next.classList.contains('goals')) next.outerHTML = goalsBlock(cur);
      }
    }

    function applyGoalCache(m) {
      const c = S.goalCache.get(Number(m.matchID));
      if (c && c.key === scoreKey(m)) { m.goals = c.goals; m.goalsError = c.error; }
    }

    async function tsdbLoadTable() {
      const base = `/lookuptable.php?l=${tsdbLeagueId()}`;
      let rows = tsdbList(await tsdb(`${base}&s=${TSDB_SEASON}`), 'table');
      if (!rows.length) rows = tsdbList(await tsdb(base), 'table');   // s= nur für Top-Ligen
      const table = rows
        .filter(t => !t.idLeague || tsdbOwn(t))
        .sort((a, b) => (Number(a.intRank) || 99) - (Number(b.intRank) || 99))
        .map(t => ({
          rank: Number(t.intRank), teamId: Number(t.idTeam), teamName: t.strTeam, shortName: t.strTeam, teamIconUrl: tsdbBadge(t.strBadge),
          matches: t.intPlayed, won: t.intWin, draw: t.intDraw, lost: t.intLoss,
          goals: t.intGoalsFor, opponentGoals: t.intGoalsAgainst, goalDiff: t.intGoalDifference, points: t.intPoints
        }));
      S.tableNote = '';
      // Manche Ligen (z. B. Handball-Bundesliga) hat TheSportsDB ohne
      // Tabelle. Dann wird die Tabelle aus den beendeten Spielen berechnet.
      if (!table.length) {
        const computed = computeStandings(S.matches);
        if (computed.length) {
          S.tableNote = 'Tabelle aus den Spielergebnissen berechnet (TheSportsDB liefert keine Tabelle).';
          return computed;
        }
      }
      return table;
    }

    // Tabelle aus Spielergebnissen aufbauen (Fußball 3 Punkte Sieg, sonst 2;
    // 1 Punkt Remis). Nur beendete Spiele mit Ergebnis zählen.
    function computeStandings(matches) {
      const winPts = isFootball() ? 3 : 2, drawPts = 1;
      const byTeam = new Map();
      const team = (t, id) => {
        const tid = Number(id);
        const key = Number.isInteger(tid) && tid > 0 ? tid : String(t.teamName || '');
        if (!byTeam.has(key)) byTeam.set(key, {
          teamId: Number.isInteger(tid) && tid > 0 ? tid : 0,
          teamName: t.teamName, shortName: t.shortName || t.teamName,
          teamIconUrl: t.teamIconUrl || '', matches: 0, won: 0, draw: 0, lost: 0,
          goals: 0, opponentGoals: 0, points: 0
        });
        return byTeam.get(key);
      };
      for (const m of matches || []) {
        const r = finalResult(m);
        if (!m.matchIsFinished || m.matchIsOff || !r) continue;
        const s1 = Number(r.pointsTeam1), s2 = Number(r.pointsTeam2);
        if (!Number.isInteger(s1) || !Number.isInteger(s2) || s1 < 0 || s2 < 0) continue;
        const h = team(m.team1 || {}, m.team1 && m.team1.teamId);
        const a = team(m.team2 || {}, m.team2 && m.team2.teamId);
        h.matches++; a.matches++;
        h.goals += s1; h.opponentGoals += s2;
        a.goals += s2; a.opponentGoals += s1;
        if (s1 > s2) { h.won++; h.points += winPts; a.lost++; }
        else if (s1 < s2) { a.won++; a.points += winPts; h.lost++; }
        else { h.draw++; a.draw++; h.points += drawPts; a.points += drawPts; }
      }
      return [...byTeam.values()]
        .map(t => ({ ...t, goalDiff: t.goals - t.opponentGoals }))
        .sort((a, b) =>
          b.points - a.points
          || b.goalDiff - a.goalDiff
          || b.goals - a.goals
          || (a.matches - b.matches)
          || String(a.teamName || '').localeCompare(String(b.teamName || '')))
        .map((t, i) => ({ ...t, rank: i + 1 }));
    }

    function finalResult(m) {
      if (!m.matchResults || !m.matchResults.length) return null;
      return m.matchResults.reduce((a, b) => a.resultOrderID > b.resultOrderID ? a : b);
    }

    function fmtDate(s) {
      const d = new Date(s);
      const wd = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'][d.getDay()];
      const dd = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
      const tm = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      const full = d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return { wd, dd, tm, full, raw: d };
    }

    function isLive(m) {
      if (m.matchIsFinished || m.matchIsOff) return false;
      if (m.liveStatus) return true;
      const ms = Date.now() - new Date(m.matchDateTime).getTime();
      return ms >= 0 && ms <= durOf(m);
    }

    function getLiveMatches() { return S.matches.filter(isLive); }

    // Anstoß ist lange vorbei, aber die Quelle hat nie ein Ergebnis eingetragen.
    function isStale(m) {
      return !m.matchIsFinished && !m.matchIsOff && !isLive(m)
        && Date.now() > Date.parse(m.matchDateTime) + durOf(m);
    }

    function matchMinute(m) {
      if (m.liveStatus === 'ht') return 'HZ';
      if (m.liveMinute) return m.liveMinute + "'";
      // Ohne Live-Daten aus der Anstoßzeit geschätzt.
      const { half, pause } = sportCfg();
      const min = Math.floor((Date.now() - new Date(m.matchDateTime).getTime()) / 60000);
      if (min <= half) return min + "'";
      if (min <= half + pause) return 'HZ';
      // Handball: die Uhr steht bei Auszeiten, daher nicht über das Spielende hinaus schätzen.
      const played = min - pause;
      return (isFootball() ? played : Math.min(played, 2 * half)) + "'";
    }

    function fmtTime(d) { return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
    // ━━━ Team-Icons ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // Reihenfolge beim Laden: API-URL → Wikimedia Special:FilePath → ausblenden.

    // Ersatz-URL für Wikimedia-Uploads: Special:FilePath folgt Umbenennungen
    // und Verschiebungen nach Commons, der Hash-Pfad der API dagegen nicht.
    function wikiFilePath(url) {
      const m = /^https?:\/\/upload\.wikimedia\.org\/wikipedia\/([a-z-]+)\/(?:thumb\/)?[0-9a-f]\/[0-9a-f]{2}\/([^/?#]+)/.exec(url || '');
      if (!m) return null;
      const host = m[1] === 'commons' ? 'commons.wikimedia.org' : `${m[1]}.wikipedia.org`;
      return `https://${host}/wiki/Special:FilePath/${m[2]}`;
    }

    function teamIcon(t) {
      const orig = safeIconUrl(t.teamIconUrl);
      const attrs = `data-orig="${esc(orig)}"`;
      if (!orig) {
        return `<img class="team-icon" alt="" ${attrs} style="visibility:hidden" src="data:,">`;
      }
      return `<img class="team-icon" src="${esc(orig)}" alt="" loading="lazy" ${attrs} onerror="iconFail(this)">`;
    }

    function iconFail(img) {
      const d = img.dataset;
      if (d.tried) { img.style.visibility = 'hidden'; return; }
      const url = safeIconUrl(wikiFilePath(d.orig));
      if (url && url !== img.getAttribute('src')) {
        d.tried = '1';
        img.src = url;
        return;
      }
      img.style.visibility = 'hidden';
    }

    // Maskiert für Text UND Attribute (inkl. " und '). API-Daten sind
    // Community-Daten und gelten als nicht vertrauenswürdig.
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    }

    // Zahlen aus der API nie ungeprüft ins HTML: nur ganze Zahlen, sonst –.
    function num(v) {
      const n = Number(v);
      return Number.isInteger(n) ? String(n) : '–';
    }

    // Icon-URLs nur über HTTPS (kein javascript:, data:, http: usw.).
    function safeUrl(u) {
      try { const x = new URL(String(u)); return x.protocol === 'https:' ? x.href : ''; }
      catch (e) { return ''; }
    }

    // Wappen-URLs stammen aus Community-Daten (TheSportsDB). Nur
    // diese Hosts werden geladen, sonst könnte ein eingetragenes "Wappen" als
    // Zählpixel dienen. Muss zur img-src-Liste der Content-Security-Policy passen.
    const ICON_HOSTS = [/^upload\.wikimedia\.org$/, /^commons\.wikimedia\.org$/, /^[a-z-]+\.wikipedia\.org$/,
      /^r2\.thesportsdb\.com$/, /^www\.thesportsdb\.com$/];
    function safeIconUrl(u) {
      const x = safeUrl(u);
      if (!x) return '';
      const host = new URL(x).hostname;
      return ICON_HOSTS.some(r => r.test(host)) ? x : '';
    }

    function groupByDay(matches) {
      const g = {};
      for (const m of matches) {
        const id = m.group.groupOrderID;
        if (!g[id]) g[id] = { name: m.group.groupName, id, matches: [] };
        g[id].matches.push(m);
      }
      for (const v of Object.values(g)) v.matches.sort((a, b) => new Date(a.matchDateTime) - new Date(b.matchDateTime));
      return g;
    }

    function applyMatches(matches) {
      matches.forEach(m => { applyLive(m); applyGoalCache(m); });
      S.matches = matches;
      S.mdays = groupByDay(matches);
      // Vereinsansicht: ganze Saison, daher neueste vergangene Spiele zuerst.
      if (leagueCfg().club && S.mdays[1]) S.mdays[1].matches.reverse();
      const n = isListView() ? 2 : leagueCfg().tsdb.rounds;
      const all = new Set(Object.keys(S.mdays).map(Number));
      for (let i = 1; i <= n; i++) all.add(i);
      S.order = [...all].sort((a, b) => roundOrder(a) - roundOrder(b));
    }

    // Erstes Laden einer Liga; liefert den aktuellen Spieltag.
    async function loadInitial() {
      S.live = new Map();
      if (leagueCfg().favorites) {
        applyMatches(await loadFavorites());
        return S.mdays[2] && S.mdays[2].matches.length ? 2 : 1;
      }
      if (leagueCfg().club) {
        applyMatches(await loadClub());
        return S.mdays[2] && S.mdays[2].matches.length ? 2 : 1;
      }
      if (leagueCfg().team) {
        applyMatches(await tsdbLoadTeam());
        return S.mdays[2] ? 2 : 1;
      }
      applyMatches(await tsdbReloadSeason());
      if (getLiveMatches().length) {
        try { await tsdbLoadLive(); applyMatches(S.matches); } catch (e) { }
      }
      return tsdbCurrentRound();
    }

    // ━━━ Live Polling ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function startPolling() { stopPolling(); S.pollTimer = setInterval(() => refreshData(true), LIVE_POLL_MS); }
    function stopPolling() { if (S.pollTimer) { clearInterval(S.pollTimer); S.pollTimer = null; } }

    async function refreshData(silent) {
      try {
        if (leagueCfg().favorites) applyMatches(await loadFavorites());
        else if (leagueCfg().club) applyMatches(await loadClub());
        else if (leagueCfg().team) applyMatches(await tsdbLoadTeam());
        else {
          let reload = Date.now() - S.seasonLoadedAt > TSDB_SEASON_REFRESH_MS;
          try { if (await tsdbLoadLive()) reload = true; }
          catch (e) { reload = true; }          // Feed nicht erreichbar: Saisondaten nehmen
          applyMatches(reload ? await tsdbReloadSeason() : S.matches);
        }
        S.lastUpdate = new Date();
        updateLiveIndicator();
        if (S.view === 'schedule') renderMatches();
        if (S.view === 'live') renderLive();
        if (S.view === 'table') { S.table = null; loadTable(); }
      } catch (e) { if (!silent) throw e; }
    }

    // ━━━ Live Indicator ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function updateLiveIndicator() {
      const live = getLiveMatches();
      const btn = document.querySelector('.live-btn');
      if (live.length > 0) {
        btn.classList.add('has-live');
        if (!S.pollTimer) startPolling();
      } else {
        btn.classList.remove('has-live');
        if (S.view === 'live') switchView('schedule');
        stopPolling();
      }
    }

    // ━━━ Teilen: Link, Text, geteiltes Spiel öffnen ━━━━━━
    // Geteilte Spiele stehen im Hash: #g=<Ligacode>t<Spiel-ID>, z. B.
    // #g=m1t1s3r. Die Spiel-ID ist base36-kodiert. Liga und Spiel-ID reichen
    // aus, um die richtigen Daten zu laden – Spieltag und Saison ergeben sich
    // aus dem Spiel, mehr steht bewusst nicht im Link. Der Buchstabe t ist
    // historisch (früher Kennung der Datenquelle) und bleibt aus Kompatibilität
    // zu bestehenden Links Teil des Formats.
    const SHARE_LEAGUES = {};
    for (const [k, l] of Object.entries(LEAGUES)) if (l.code) SHARE_LEAGUES[l.code] = k;
    const SHARE_CODES = Object.keys(SHARE_LEAGUES).sort((a, b) => b.length - a.length);

    function tokenOf(m) {
      const id = Number(m.matchID);
      const code = leagueCfg(m.leagueKey || S.league).code;
      return code && Number.isInteger(id) && id > 0
        ? code + 't' + id.toString(36) : null;
    }

    function parseShareToken(t) {
      for (const code of SHARE_CODES) {
        if (!t.startsWith(code)) continue;
        const mid = parseInt(t.slice(code.length + 1), 36);
        if (Number.isInteger(mid) && mid > 0) {
          return { lk: SHARE_LEAGUES[code], mid };
        }
        return null;
      }
      return null;
    }

    function readShareHash() {
      const m = /^#g=([a-z0-9]+)$/.exec(String(location.hash || '').toLowerCase());
      return m ? parseShareToken(m[1]) : null;
    }

    // Share-Text: wer, wann, Liga (die wichtigsten Infos zum Spiel).
    function shareInfo(m) {
      const lk = m.leagueKey || S.league, l = leagueCfg(lk);
      const d = fmtDate(m.matchDateTime);
      const nm = t => t.teamName || t.shortName || '';
      const who = `${nm(m.team1)} – ${nm(m.team2)}`;
      const when = m.matchIsOff ? m.offLabel : `${d.wd}, ${d.dd} · ${d.tm} Uhr`;
      // Listen (Nationalmannschaft, Meine Spiele): Wettbewerb statt Spieltag.
      const ctx = m.listView ? (m.competition || l.fullLabel)
        : `${l.fullLabel} · ${roundInfo(m.group.groupOrderID, lk).long}`;
      return { who, when, ctx };
    }

    function shareBtnHTML(m, n1, n2, cls) {
      const t = tokenOf(m);
      if (!t) return '';
      return `<button class="share-btn${cls ? ' ' + cls : ''}" type="button" data-share="${t}"
    aria-label="${n1} gegen ${n2} teilen" title="Teilen"><svg class="ico-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m8 7 4-4 4 4"/><path d="M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/></svg><svg class="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>`;
    }

    function shareUrl(m) {
      const t = tokenOf(m);
      if (!t) return '';
      const base = /^https?:$/.test(location.protocol) ? location.origin : 'https://ligazeit.de';
      return `${base}/#g=${t}`;
    }

    // Web Share API (WhatsApp & Co. im System-Dialog), sonst Link kopieren.
    function shareMatch(m, btn) {
      const info = shareInfo(m), url = shareUrl(m);
      if (!url) return;
      // Das Link-Bild ist für alle Spiele gleich (Messenger cachen es lange und
      // führen kein JS aus), also trägt der Text die Info: Spiel, Stand, Zeit, Liga.
      const r = finalResult(m);
      let status = '';
      if (r && m.matchIsFinished) status = `\n🏁 Endstand ${num(r.pointsTeam1)}:${num(r.pointsTeam2)}`;
      else if (isLive(m)) status = `\n🔴 Live ${matchMinute(m)} · ${r ? num(r.pointsTeam1) + ':' + num(r.pointsTeam2) : '0:0'}`;
      const text = `⚽ ${info.who}${status}\n🕐 ${info.when}\n🏆 ${info.ctx}`;
      if (navigator.share) {
        // Link bewusst im Text statt im url-Feld: Das macOS-Teilen-Menü (Kopieren,
        // Notizen, …) übernimmt sonst nur die URL und verwirft den Text.
        navigator.share({ title: info.who, text: `${text}\n${url}` })
          .catch(err => { if (!err || err.name !== 'AbortError') copyShare(text, url, btn); });
        return;
      }
      copyShare(text, url, btn);
    }

    function copyShare(text, url, btn) {
      const full = `${text}\n${url}`;
      const ok = () => shareCopied(btn);
      const legacy = () => {
        const ta = document.createElement('textarea');
        ta.value = full;
        ta.style.cssText = 'position:fixed;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        let copied = false;
        try { copied = document.execCommand('copy'); } catch (e) { }
        ta.remove();
        return copied;
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(full).then(ok).catch(() => { if (legacy()) ok(); });
      } else if (legacy()) ok();
    }

    function showToast(msg) {
      let t = document.getElementById('toast');
      if (!t) {
        t = document.createElement('div');
        t.id = 'toast'; t.className = 'toast';
        t.setAttribute('role', 'status');
        document.body.appendChild(t);
      }
      t.textContent = msg;
      requestAnimationFrame(() => t.classList.add('show'));
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function shareCopied(btn) {
      showToast('Kopiert – Spiel und Link in der Zwischenablage');
      const prev = btn.getAttribute('aria-label');
      btn.classList.add('copied');
      btn.setAttribute('aria-label', 'Link kopiert');
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(() => {
        btn.classList.remove('copied');
        btn.setAttribute('aria-label', prev);
      }, 1600);
    }

    function onShareClick(btn) {
      const t = parseShareToken(btn.dataset.share || '');
      if (!t) return;
      const m = S.matches.find(x => Number(x.matchID) === t.mid
        && (x.leagueKey || S.league) === t.lk);
      if (m) shareMatch(m, btn);
    }

    // ── Geteiltes Spiel: finden, hervorheben, öffnen ──
    function findSharedMatch() {
      if (!S.share) return null;
      return S.matches.find(m => Number(m.matchID) === S.share.mid
        && (m.leagueKey || S.league) === S.share.lk) || null;
    }

    function isSharedMatch(m) {
      return !!S.share && (m.leagueKey || S.league) === S.share.lk
        && Number(m.matchID) === S.share.mid;
    }

    function scrollSharedRow() {
      if (!S.share || S.share.scrolled) return;
      const row = document.querySelector('.match-row.shared');
      if (!row) return;
      S.share.scrolled = true;
      // Erst nach dem Tab-Scrollen aus renderTabs (rAF): Das Tab-Scrollen
      // würde die Position sonst wieder auf den Spieltag-Anfang zurückholen.
      setTimeout(() => row.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
    }

    // Hash-Ziel anwenden: Liga einstellen, Spieltag wählen, Spiel hervorheben.
    // Aufruf beim ersten Laden und bei hashchange.
    function applyShareTarget(t) {
      S.share = { lk: t.lk, mid: t.mid, scrolled: false };
      if (S.league === t.lk) {
        const sm = findSharedMatch();
        if (sm) {
          switchView('schedule');
          S.sel = sm.group.groupOrderID;
          renderTabs(); renderMatches();
          scrollSharedRow();
        }
        return;
      }
      switchLeague(t.lk);
    }

    // ━━━ Render: League Select ━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderLeagueSwitch() {
      syncClubOption();
      $('leagueSelect').value = S.league;
      $('pageTitle').textContent = leagueCfg().title;
      $('clubBack').classList.toggle('hidden', !leagueCfg().club);
      const noTable = isListView();
      const tf = titleFav();
      $('favTitle').classList.toggle('hidden', !tf);
      if (tf) setStar($('favTitle'), isFav(tf), tf.name || leagueCfg().fullLabel);
      document.querySelector('.view-btn[data-view="table"]').classList.toggle('hidden', noTable);
      if (noTable && S.view === 'table') switchView('schedule');
    }

    // ━━━ Render: Tabs ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderTabs() {
      const c = $('tabsMD');
      let h = `<span class="md-label">${roundLabel()}</span>`;
      for (const n of S.order) {
        const cls = ['md-tab'];
        if (n === S.sel) cls.push('active');
        if (n === S.cur) cls.push('current');
        const ri = roundInfo(n);
        h += `<button class="${cls.join(' ')}" data-md="${n}" title="${esc(ri.long)}">${esc(ri.short)}</button>`;
      }
      c.innerHTML = h;
      requestAnimationFrame(() => {
        const a = c.querySelector('.md-tab.active');
        if (a) a.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      });
    }

    // ━━━ Render: Matches ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderMatches() {
      const el = $('viewSchedule');
      const md = S.mdays[S.sel];
      if (!md || !md.matches.length) {
        const msg = leagueCfg().favorites
          ? (getFavs().length ? (S.sel === 2 ? 'In den nächsten Wochen spielt keines deiner Teams.' : 'Deine Teams haben zuletzt nicht gespielt.')
            : 'Noch keine Favoriten. Markiere Teams in einer Tabelle mit dem Stern ☆, Nationalmannschaften neben dem Titel.')
          : leagueCfg().club
          ? (S.sel === 2 ? 'Für diesen Verein steht kein kommendes Spiel im Spielplan.' : 'Für diesen Verein liegen noch keine Spiele vor.')
          : leagueCfg().team
          ? (S.sel === 2 ? 'Bei TheSportsDB ist derzeit kein kommendes Spiel eingetragen.' : 'Derzeit liegen keine Daten vor.')
          : `${leagueCfg().cup ? 'Für diese Runde' : 'Für diesen Spieltag'} liegen keine Daten vor.`;
        el.innerHTML = `<div class="card"><div class="state-msg"><div class="ico">📋</div><h3>Keine Spiele</h3><p>${msg}</p></div></div>`;
        return;
      }
      const fin = md.matches.filter(m => m.matchIsFinished).length;
      const byDate = new Map();
      for (const m of md.matches) {
        let k = fmtDate(m.matchDateTime).full;
        if (isListView() && m.competition) k += ` · ${m.competition}`;
        if (!byDate.has(k)) byDate.set(k, []);
        byDate.get(k).push(m);
      }
      let rows = '';
      for (const [label, matches] of byDate) {
        rows += `<div class="date-sep">${esc(label)}</div>`;
        for (const m of matches) rows += matchRow(m);
      }
      el.innerHTML = `<div class="card">
    <div class="card-header"><h2>${esc(md.name)}</h2><span class="pill pill-muted">${fin} / ${md.matches.length} beendet</span></div>
    ${rows}</div>`;
    }

    function matchRow(m) {
      const d = fmtDate(m.matchDateTime);
      const r = finalResult(m);
      const li = isLive(m);
      const t1 = m.team1, t2 = m.team2;
      const n1 = esc(t1.shortName || t1.teamName), n2 = esc(t2.shortName || t2.teamName);
      const i1 = teamIcon(t1);
      const i2 = teamIcon(t2);
      const c1 = clubAttrs(m, t1), c2 = clubAttrs(m, t2);
      const sb = shareBtnHTML(m, n1, n2, 'share-desk');
      const sbm = shareBtnHTML(m, n1, n2, '');
      let scoreD, scoreM1 = '', scoreM2 = '', stHTML, metaSt;
      if (m.matchIsFinished && r) {
        scoreD = `<div class="score fin">${num(r.pointsTeam1)} <span class="score-sep">:</span> ${num(r.pointsTeam2)}</div>`;
        scoreM1 = num(r.pointsTeam1); scoreM2 = num(r.pointsTeam2);
        stHTML = '<span class="st st-fin">Beendet</span>'; metaSt = stHTML;
      } else if (li && r) {
        scoreD = `<div class="score live">${num(r.pointsTeam1)} <span class="score-sep">:</span> ${num(r.pointsTeam2)}</div>`;
        scoreM1 = num(r.pointsTeam1); scoreM2 = num(r.pointsTeam2);
        stHTML = `<span class="st st-live"><span class="live-dot"></span> ${matchMinute(m)}</span>`; metaSt = stHTML;
      } else if (li) {
        scoreD = `<div class="score live">0 <span class="score-sep">:</span> 0</div>`;
        scoreM1 = '0'; scoreM2 = '0';
        stHTML = `<span class="st st-live"><span class="live-dot"></span> ${matchMinute(m)}</span>`; metaSt = stHTML;
      } else if (isStale(m)) {
        scoreD = `<div class="score upc">–</div>`;
        stHTML = '<span class="st st-upc">Ergebnis fehlt</span>';
        metaSt = stHTML;
      } else if (m.matchIsOff) {
        scoreD = `<div class="score upc">–</div>`;
        stHTML = `<span class="st st-upc">${esc(m.offLabel)}</span>`;
        metaSt = stHTML;
      } else {
        scoreD = `<div class="score upc">${d.tm} Uhr</div>`;
        stHTML = `<span class="st st-upc">${d.wd}. ${d.dd}</span>`;
        metaSt = '';
      }
      // Nur begonnene Spiele haben einen Spielverlauf zum Aufklappen.
      const id = Number(m.matchID);
      const canOpen = sportCfg().goalDetails && !isStale(m) && Number.isInteger(id) && (m.matchIsFinished || li || !!r);
      const open = canOpen && S.openMatches.has(id);
      const chev = canOpen ? '<span class="chev" aria-hidden="true"></span>' : '';
      const attrs = canOpen
        ? ` expandable${open ? ' open' : ''}" role="button" tabindex="0" data-mid="${id}" aria-expanded="${open}" aria-controls="goals-${id}" aria-label="Spielverlauf ${n1} gegen ${n2}`
        : '';
      return `<div class="match-row${isSharedMatch(m) ? ' shared' : ''}${attrs}">
    <div class="m-mobile-meta"><span>${d.tm} Uhr</span><span class="m-meta-st">${metaSt}${chev}</span>${sbm}</div>
    <div class="m-time">${d.tm}</div>
    <div class="team home"><span class="team-name${isFavTeam(m, t1) ? ' is-fav' : ''}${c1 ? ' club-link' : ''}"${c1}>${n1}</span>${i1}<span class="team-score">${scoreM1}</span></div>
    ${scoreD}
    <div class="team away">${i2}<span class="team-name${isFavTeam(m, t2) ? ' is-fav' : ''}${c2 ? ' club-link' : ''}"${c2}>${n2}</span><span class="team-score">${scoreM2}</span></div>
    <div class="m-status">${stHTML}${chev}</div>${sb}</div>${open ? goalsBlock(m) : ''}`;
    }

    // ━━━ Spielverlauf: Tore mit Zwischenstand, Torschützin/Torschütze, Minute ━━
    function goalsBlock(m) {
      const id = Number(m.matchID);
      const cached = S.goalCache.get(id);
      const retry = cached && cached.key === scoreKey(m)
        && cached.incomplete && Date.now() - cached.at > GOALS_RETRY_MS;
      if (m.goals == null || retry) {
        tsdbLoadGoals(m);
        return `<div class="goals" id="goals-${id}"><div class="g-empty">Spielverlauf wird geladen…</div></div>`;
      }
      if (m.goalsError) {
        return `<div class="goals" id="goals-${id}"><div class="g-empty">Spielverlauf konnte nicht geladen werden.</div></div>`;
      }
      const r = finalResult(m);
      const total = r ? (Number(r.pointsTeam1) || 0) + (Number(r.pointsTeam2) || 0) : 0;
      const goals = (Array.isArray(m.goals) ? m.goals : [])
        .filter(g => g && Number.isFinite(Number(g.scoreTeam1)) && Number.isFinite(Number(g.scoreTeam2)))
        .map(g => ({
          s1: Number(g.scoreTeam1), s2: Number(g.scoreTeam2),
          min: Number.isFinite(Number(g.matchMinute)) && g.matchMinute !== null ? Number(g.matchMinute) : null,
          name: String(g.goalGetterName || '').trim(),
          pen: g.isPenalty === true, og: g.isOwnGoal === true
        }))
        .sort((a, b) => (a.s1 + a.s2) - (b.s1 + b.s2) || (a.min ?? 999) - (b.min ?? 999));

      const scorerLabel = leagueCfg(m.leagueKey).gender === 'frauen' ? 'Torschützin' : 'Torschütze';
      let html = '';
      if (goals.length) {
        let p1 = 0, p2 = 0;
        const rows = goals.map(g => {
          // Die Zahl des Teams, das getroffen hat, wird hervorgehoben.
          const a = g.s1 > p1 ? `<b>${g.s1}</b>` : `${g.s1}`;
          const b = g.s2 > p2 ? `<b>${g.s2}</b>` : `${g.s2}`;
          p1 = g.s1; p2 = g.s2;
          const note = g.og ? 'Eigentor' : g.pen ? 'Elfmeter' : '';
          const min = fmtGoalMinute(g);
          return `<tr><td class="g-score">${a}:${b}</td>`
            + `<td>${esc(g.name || 'unbekannt')}${note ? `<span class="g-note">${note}</span>` : ''}</td>`
            + `<td class="g-min">${min}</td></tr>`;
        }).join('');
        html += `<table><thead><tr><th class="g-score">Ergebnis</th><th>${scorerLabel}</th><th class="g-min">Minute</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
      if (!goals.length) {
        html += total === 0 && m.matchIsFinished
          ? '<div class="g-empty">Keine Tore.</div>'
          : total === 0
            ? '<div class="g-empty">Noch keine Tore.</div>'
            : '<div class="g-empty">Für dieses Spiel sind keine Torschützen eingetragen.</div>';
      } else if (goals.length < total) {
        html += '<div class="g-empty">Nicht alle Tore sind eingetragen.</div>';
      }
      return `<div class="goals" id="goals-${id}">${html}</div>`;
    }

    function fmtGoalMinute(g) {
      return g.min === null ? '–' : `${g.min}'`;
    }

    function toggleMatch(row) {
      const id = Number(row.dataset.mid);
      const m = S.matches.find(x => Number(x.matchID) === id);
      if (!m) return;
      const open = !S.openMatches.has(id);
      if (open) S.openMatches.add(id); else S.openMatches.delete(id);
      row.classList.toggle('open', open);
      row.setAttribute('aria-expanded', String(open));
      const next = row.nextElementSibling;
      if (next && next.classList.contains('goals')) next.remove();
      if (open) row.insertAdjacentHTML('afterend', goalsBlock(m));
    }

    // ━━━ Render: Live View ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderLive() {
      const el = $('viewLive');
      const live = getLiveMatches();
      if (!live.length) {
        el.innerHTML = `<div class="live-empty"><div class="ico">😴</div><p>Aktuell läuft kein Spiel.</p></div>`;
        return;
      }
      const updTxt = S.lastUpdate ? fmtTime(S.lastUpdate) : '–';
      let cards = '';
      for (const m of live) {
        const r = finalResult(m);
        const t1 = m.team1, t2 = m.team2;
        const n1 = esc(t1.shortName || t1.teamName), n2 = esc(t2.shortName || t2.teamName);
        const i1 = teamIcon(t1);
        const i2 = teamIcon(t2);
        const c1 = clubAttrs(m, t1), c2 = clubAttrs(m, t2);
        const s1 = r ? num(r.pointsTeam1) : '0', s2 = r ? num(r.pointsTeam2) : '0';
        const min = matchMinute(m);
        const mdName = m.group ? esc(m.group.groupName) : '';
        const sb = shareBtnHTML(m, n1, n2, '');
        cards += `<div class="live-card"><div class="live-card-body"><div class="live-teams">
      <div class="live-team-row"><div class="live-team-info">${i1}<span class="live-team-name${c1 ? ' club-link' : ''}"${c1}>${n1}</span></div><span class="live-team-score">${s1}</span></div>
      <div class="live-team-row"><div class="live-team-info">${i2}<span class="live-team-name${c2 ? ' club-link' : ''}"${c2}>${n2}</span></div><span class="live-team-score">${s2}</span></div>
    </div></div><div class="live-card-footer">
      <span class="live-minute"><span class="live-dot"></span> ${min}</span><span class="live-matchday">${mdName}${sb}</span>
    </div></div>`;
      }
      el.innerHTML = `<div class="live-header">
    <h2><span class="live-dot"></span> ${live.length} Live-Spiel${live.length > 1 ? 'e' : ''}</h2>
    <div class="live-meta"><span class="auto-tag">Auto-Refresh</span><span>Aktualisiert: ${updTxt}</span></div>
  </div><div class="live-grid">${cards}</div>`;
    }

    // ━━━ Render: Table ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function renderTable() {
      const el = $('viewTable');
      if (!S.table) {
        el.innerHTML = '<div class="card"><div class="state-msg"><div class="spinner"></div><span>Tabelle wird geladen…</span></div></div>';
        return;
      }
      if (!S.table.length) {
        el.innerHTML = '<div class="card"><div class="state-msg"><div class="ico">📋</div><h3>Keine Tabelle</h3><p>Für diese Liga liegt noch keine Tabelle vor.</p></div></div>';
        return;
      }
      const rows = S.table.map((t, i) => {
        const ic = teamIcon(t);
        const nm = esc(t.shortName || t.teamName);
        const df = Number(t.goalDiff), dc = df > 0 ? 'pos' : df < 0 ? 'neg' : '', ds = df > 0 ? '+' + num(df) : num(df);
        const rk = Number.isInteger(t.rank) && t.rank > 0 ? t.rank : i + 1;
        const tid = Number(t.teamId ?? t.teamInfoId);
        const fe = Number.isInteger(tid) && tid > 0 ? favEntry(S.league, tid, t.teamName) : null;
        const star = fe ? `<button class="fav-star${isFav(fe) ? ' on' : ''}" type="button" data-fav="${tid}" data-name="${esc(t.teamName || '')}" aria-pressed="${isFav(fe)}" aria-label="${esc(t.teamName || '')} ${isFav(fe) ? 'nicht mehr ' : ''}als Favorit merken">${isFav(fe) ? '★' : '☆'}</button>` : '';
        const ca = clubAttrsFor(S.league, t);
        return `<tr><td class="rk">${rk}</td><td><div class="tc">${ic}<span${ca ? ` class="club-link"${ca}` : ''}>${nm}</span>${star}</div></td>
      <td class="c">${num(t.matches)}</td><td class="c">${num(t.won)}</td><td class="c">${num(t.draw)}</td><td class="c">${num(t.lost)}</td>
      <td class="c">${num(t.goals)}:${num(t.opponentGoals)}</td><td class="diff ${dc}">${ds}</td><td class="pts">${num(t.points)}</td></tr>`;
      }).join('');
      el.innerHTML = `<div class="card">
    <div class="card-header"><h2>Tabelle – ${esc(leagueCfg().fullLabel)}</h2><span class="pill pill-muted">Saison ${SEASON}/${String(SEASON + 1).slice(-2)}</span></div>
    <div style="overflow-x:auto"><table class="lt"><thead><tr>
      <th class="c">#</th><th>Verein</th><th class="c">Sp</th><th class="c">S</th><th class="c">U</th><th class="c">N</th><th class="c">Tore</th><th class="c">Diff</th><th class="c">Pkt</th>
    </tr></thead><tbody>${rows}</tbody></table></div>${S.tableNote ? `<div class="table-note">${esc(S.tableNote)}</div>` : ''}</div>`;
    }

    // ━━━ Favoriten ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // Gespeichert nur im Browser. Ein Eintrag gilt für das Team in der Liga,
    // in deren Tabelle der Stern gesetzt wurde, plus die Champions League
    // desselben Geschlechts (gleiche TheSportsDB-Team-ID). Ältere Einträge mit
    // einer Quellenangabe (src) stammen aus OpenLigaDB-Zeiten und entfallen.
    const FAV_STORE = 'bl-favorites';
    const FAV_PAST_DAYS = 14, FAV_NEXT_DAYS = 45;
    let favCache = null;

    function getFavs() {
      if (favCache) return favCache;
      try {
        const v = JSON.parse(localStorage.getItem(FAV_STORE) || '[]');
        favCache = Array.isArray(v) ? v.filter(f => f && !f.src && LEAGUES[f.lk] && Number.isInteger(f.id)) : [];
      } catch (e) { favCache = []; }
      return favCache;
    }
    function saveFavs(list) {
      favCache = list;
      try { localStorage.setItem(FAV_STORE, JSON.stringify(list)); } catch (e) { }
    }
    function favEntry(lk, id, name) { return { lk, id: Number(id), name: name || '' }; }
    const favSame = (a, b) => a.lk === b.lk && a.id === b.id;
    function isFav(f) { return getFavs().some(x => favSame(x, f)); }
    function toggleFav(f) {
      const list = getFavs();
      saveFavs(isFav(f) ? list.filter(x => !favSame(x, f)) : [...list, f]);
    }
    // Ist dieses Team (unabhängig von der Liga) ein Favorit?
    function isFavTeam(m, t) {
      const id = Number(t.teamId);
      return Number.isInteger(id) && id > 0 && getFavs().some(f => f.id === id);
    }
    function setStar(btn, on, name) {
      btn.classList.toggle('on', on);
      btn.textContent = on ? '★' : '☆';
      btn.setAttribute('aria-pressed', String(on));
      btn.setAttribute('aria-label', `${name} ${on ? 'nicht mehr ' : ''}als Favorit merken`);
      btn.title = on ? 'Favorit entfernen' : 'Als Favorit merken';
    }

    // Spiele der Teams `entries` ({ lk, id }) aus allen betroffenen
    // Wettbewerben einsammeln: je Liga die Team-IDs, die dort interessieren.
    // Liefert die Ergebnisse von Promise.allSettled.
    function collectTeamMatches(entries) {
      const plan = new Map();
      const want = (lk, id) => {
        if (!plan.has(lk)) plan.set(lk, { lk, ids: new Set() });
        plan.get(lk).ids.add(id);
      };
      for (const f of entries) {
        const l = LEAGUES[f.lk];
        want(f.lk, f.id);
        // Europapokal dazu (dieselbe Team-ID in beiden Wettbewerben)
        if (!l.team && !l.cup && (l.sport || 'fussball') === 'fussball') {
          want(l.gender === 'frauen' ? 'uwcl' : 'ucl', f.id);
        }
      }
      return Promise.allSettled([...plan.values()].map(async p => {
        const l = LEAGUES[p.lk];
        // Nationalmannschaften: letzte und nächste Spiele je Mannschaft
        if (l.team) {
          const lists = await Promise.all([...p.ids].map(id => tsdbLoadTeam(p.lk, id)));
          return lists.flat().map(m => Object.assign(m, { leagueKey: p.lk }));
        }
        const all = await tsdbLoadSeason(p.lk);
        return all
          .filter(m => p.ids.has(Number(m.team1 && m.team1.teamId)) || p.ids.has(Number(m.team2 && m.team2.teamId)))
          .map(m => Object.assign(m, { competition: l.fullLabel, leagueKey: p.lk }));
      }));
    }

    // Doppelte Spiele entfernen (optional nach Zeitfenster filtern) und in
    // "Zuletzt" (1) und "Demnächst" (2) einsortieren.
    function sortPastNext(parts, inRange) {
      const now = Date.now(), seen = new Set(), out = [];
      for (const r of parts) {
        if (r.status !== 'fulfilled') continue;
        for (const m of r.value) {
          const key = String(m.matchID);
          if (seen.has(key)) continue;
          seen.add(key);
          const t = Date.parse(m.matchDateTime);
          if (inRange && !inRange(t, now)) continue;
          const past = m.matchIsFinished || t + durOf(m) < now;
          const g = past ? 1 : 2;
          m.group = { groupOrderID: g, groupName: TEAM_ROUNDS[g].long };
          m.listView = true;
          out.push(m);
        }
      }
      if (!out.length && parts.every(r => r.status === 'rejected')) throw new Error('Keine Quelle erreichbar');
      return out;
    }

    // Alle Spiele der Favoriten der nächsten Wochen und der letzten Tage.
    async function loadFavorites() {
      const favs = getFavs();
      if (!favs.length) return [];
      const parts = await collectTeamMatches(favs);
      return sortPastNext(parts, (t, now) => t >= now - FAV_PAST_DAYS * 864e5 && t <= now + FAV_NEXT_DAYS * 864e5);
    }

    // ━━━ Vereinsansicht ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // Ein Klick auf einen Vereinsnamen (Spielplan, Live, Tabelle) zeigt alle
    // Spiele des Vereins in der Saison, bei Fußball inkl. Europapokal.
    async function loadClub() {
      const c = S.club;
      if (!c) return [];
      return sortPastNext(await collectTeamMatches([favEntry(c.lk, c.id, c.name)]));
    }

    // Titel-Stern: Nationalmannschaft bzw. Verein der Vereinsansicht.
    function titleFav() {
      const l = leagueCfg();
      if (l.team) return favEntry(S.league, l.team, l.fullLabel);
      if (l.club && S.club) return favEntry(S.club.lk, S.club.id, S.club.name);
      return null;
    }

    // Attribute für einen anklickbaren Vereinsnamen; leer, wenn die Ansicht
    // keinen Verein ansteuern kann (keine Team-ID).
    function clubAttrsFor(lk, t) {
      const id = Number(t && (t.teamId ?? t.teamInfoId));
      const l = LEAGUES[lk];
      if (!l || l.club || l.favorites || !Number.isInteger(id) || id <= 0) return '';
      const name = t.teamName || t.shortName || '';
      return ` data-club-id="${id}" data-club-lk="${esc(lk)}" data-club-name="${esc(name)}" role="link" tabindex="0" title="Alle Spiele: ${esc(name)}"`;
    }
    function clubAttrs(m, t) {
      return clubAttrsFor(m.leagueKey || S.league, t);
    }

    // Die Vereinsauswahl erscheint nur, solange eine Vereinsansicht offen ist.
    function syncClubOption() {
      const sel = $('leagueSelect');
      let opt = sel.querySelector('option[value="verein"]');
      if (leagueCfg().club && S.club) {
        if (!opt) {
          opt = document.createElement('option');
          opt.value = 'verein';
          sel.insertBefore(opt, sel.firstChild);
        }
        opt.textContent = '🏟 ' + S.club.name;
      } else if (opt) opt.remove();
    }

    function openClub(c) {
      if (!c || !LEAGUES[c.lk] || !Number.isInteger(c.id) || c.id <= 0) return;
      const inClub = S.league === 'verein' && !!S.club;
      if (inClub && S.club.id === c.id) return;   // schon offen
      // Ist der Verein ein Favorit, gilt die Liga seines Sterns (statt z. B. nur Champions League).
      const fav = getFavs().find(f => f.id === c.id);
      const lk = fav ? fav.lk : c.lk;
      const base = LEAGUES[lk];
      const name = c.name || (fav && fav.name) || 'Verein';
      S.club = { lk, id: c.id, name, back: inClub ? S.club.back : S.league };
      Object.assign(LEAGUES.verein, {
        sport: base.sport, gender: base.gender, fullLabel: name, label: name,
        title: `${base.sport === 'handball' ? '🤾' : '⚽'} ${name}`
      });
      if (!inClub) { try { history.pushState({ ligazeitClub: 1 }, ''); } catch (e) { } }
      switchLeague('verein', true);
    }

    // Zurück zur Liga bzw. Ansicht, aus der der Verein geöffnet wurde.
    function closeClub() {
      if (S.league !== 'verein') return;
      const back = S.club && LEAGUES[S.club.back] && !LEAGUES[S.club.back].club ? S.club.back : 'maenner1';
      S.club = null;
      switchLeague(back);
    }

    function clubFromEl(el) {
      const d = el.dataset;
      return { lk: d.clubLk, id: Number(d.clubId), name: d.clubName };
    }
    // true, wenn der Klick ein Vereinsname war.
    function onClubClick(e) {
      const el = e.target.closest('.club-link');
      if (!el) return false;
      openClub(clubFromEl(el));
      return true;
    }
    function onClubKey(e) {
      if (e.key !== 'Enter') return false;
      const el = e.target.closest('.club-link');
      if (!el) return false;
      e.preventDefault();
      openClub(clubFromEl(el));
      return true;
    }

    $('clubBack').addEventListener('click', () => {
      // Hat openClub einen Verlaufseintrag angelegt, geht der Zurück-Knopf des Browsers denselben Weg.
      if (history.state && history.state.ligazeitClub) history.back(); else closeClub();
    });
    window.addEventListener('popstate', () => { if (S.league === 'verein') closeClub(); });
    // Nach einem Neuladen gehört der Verlaufseintrag zu keiner Vereinsansicht mehr.
    try { if (history.state && history.state.ligazeitClub) history.replaceState(null, ''); } catch (e) { }

    // Stern in der Tabelle
    $('viewTable').addEventListener('click', e => {
      if (onClubClick(e)) return;
      const b = e.target.closest('.fav-star');
      if (!b) return;
      const f = favEntry(S.league, b.dataset.fav, b.dataset.name);
      toggleFav(f);
      setStar(b, isFav(f), f.name);
    });
    // Stern im Titel (Nationalmannschaften, Vereinsansicht)
    $('favTitle').addEventListener('click', () => {
      const f = titleFav();
      if (!f) return;
      toggleFav(f);
      setStar($('favTitle'), isFav(f), f.name);
    });

    // ━━━ View Switch ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function switchView(v) {
      if (v === 'live' && getLiveMatches().length === 0) return;
      S.view = v;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
      $('viewSchedule').classList.toggle('hidden', v !== 'schedule');
      $('navMD').classList.toggle('hidden', v !== 'schedule');
      $('viewLive').classList.toggle('hidden', v !== 'live');
      $('viewTable').classList.toggle('hidden', v !== 'table');
      if (v === 'table' && !S.table) loadTable();
      if (v === 'live') { renderLive(); startPolling(); }
      if (v !== 'live' && !getLiveMatches().length) stopPolling();
    }

    async function loadTable() {
      const league = S.league;
      try {
        S.tableNote = '';
        const table = await tsdbLoadTable();
        if (S.league !== league) return;   // inzwischen gewechselt
        S.table = Array.isArray(table) ? table : [];
        renderTable();
      }
      catch (e) {
        $('viewTable').innerHTML = `<div class="card"><div class="state-msg"><div class="ico">⚠️</div><h3>Fehler</h3><p>${esc(e.message)}</p>
      <button class="btn-retry" onclick="loadTable()">Erneut versuchen</button></div></div>`;
      }
    }

    // ━━━ League Switch ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    function switchLeague(key, force) {
      if (S.league === key && !force) return;
      S.league = key; S.table = null; S.openMatches.clear(); stopPolling();
      renderLeagueSwitch();
      // Die Vereinsansicht wird nicht gemerkt (es gäbe nach dem Neuladen keinen Verein).
      if (key !== 'verein') { try { localStorage.setItem('bl-league', key); } catch (e) { } }
      switchView('schedule'); init();
    }

    // ━━━ Events ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    $('tabsMD').addEventListener('click', e => {
      const t = e.target.closest('.md-tab');
      if (!t) return;
      S.sel = parseInt(t.dataset.md);
      renderTabs();
      renderMatches(); updateLiveIndicator();
    });

    $('viewToggle').addEventListener('click', e => {
      const b = e.target.closest('.view-btn');
      if (b) switchView(b.dataset.view);
    });

    $('leagueSelect').addEventListener('change', e => {
      switchLeague(e.target.value);
    });

    $('btnRefresh').addEventListener('click', () => { S.table = null; init(); });

    // ━━━ Design: 1. gespeicherte Wahl, 2. Systemeinstellung ━━━━━━━━
    const THEME_KEY = 'bl-theme';
    const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function storedTheme() {
      try {
        const t = localStorage.getItem(THEME_KEY);
        return t === 'light' || t === 'dark' ? t : null;   // nur bekannte Werte
      } catch (e) { return null; }
    }
    function systemTheme() { return darkQuery && darkQuery.matches ? 'dark' : 'light'; }

    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      $('metaThemeColor').setAttribute('content', t === 'dark' ? '#1c1d21' : '#ffffff');
      const label = t === 'dark' ? 'Helles Design einschalten' : 'Dunkles Design einschalten';
      $('btnTheme').setAttribute('aria-label', label);
      $('btnTheme').title = label;
    }

    applyTheme(storedTheme() || systemTheme());

    $('btnTheme').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
      applyTheme(next);
    });

    // Ohne gespeicherte Wahl dem System live folgen
    if (darkQuery) {
      const onSystemChange = () => { if (!storedTheme()) applyTheme(systemTheme()); };
      if (darkQuery.addEventListener) darkQuery.addEventListener('change', onSystemChange);
      else if (darkQuery.addListener) darkQuery.addListener(onSystemChange);
    }

    // Andere Tabs derselben Seite abgleichen
    window.addEventListener('storage', e => {
      if (e.key === THEME_KEY || e.key === null) applyTheme(storedTheme() || systemTheme());
    });

    $('viewSchedule').addEventListener('click', e => {
      if (onClubClick(e)) return;
      const sb = e.target.closest('.share-btn');
      if (sb) { onShareClick(sb); return; }
      const row = e.target.closest('.match-row.expandable');
      if (row) toggleMatch(row);
    });

    $('viewSchedule').addEventListener('keydown', e => {
      if (onClubKey(e)) return;
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('.match-row.expandable');
      if (!row || row !== e.target) return;
      e.preventDefault();
      toggleMatch(row);
    });

    $('viewLive').addEventListener('click', e => {
      if (onClubClick(e)) return;
      const sb = e.target.closest('.share-btn');
      if (sb) onShareClick(sb);
    });
    $('viewLive').addEventListener('keydown', onClubKey);
    $('viewTable').addEventListener('keydown', onClubKey);

    // ━━━ Init ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    async function init() {
      const rb = $('btnRefresh'); rb.classList.add('spin');
      $('badgeSeason').textContent = SEASON + '/' + String(SEASON + 1).slice(-2);
      renderLeagueSwitch();
      $('viewSchedule').innerHTML = '<div class="card"><div class="state-msg"><div class="spinner"></div><span>Spielplan wird geladen…</span></div></div>';
      $('tabsMD').innerHTML = '<span class="md-label">Spieltag</span>';
      try {
        const cur = await loadInitial();
        S.cur = cur; S.sel = cur;
        // Geteiltes Spiel: Spieltag des Spiels wählen statt des aktuellen.
        const sm = findSharedMatch();
        if (sm) S.sel = sm.group.groupOrderID;
        S.lastUpdate = new Date();
        renderTabs(); renderMatches(); updateLiveIndicator();
        scrollSharedRow();
        if (S.view === 'table') { S.table = null; loadTable(); }
      } catch (e) {
        $('viewSchedule').innerHTML = `<div class="card"><div class="state-msg">
      <div class="ico">⚠️</div><h3>Daten konnten nicht geladen werden</h3>
      <p>Bitte Internetverbindung prüfen oder später erneut versuchen.</p>
      <p style="margin-top:6px;font-size:12px;color:var(--text3)">${esc(e.message)}</p>
      <button class="btn-retry" onclick="init()">Erneut versuchen</button></div></div>`;
      } finally { rb.classList.remove('spin'); }
    }

    // ━━━ localStorage: Alte Keys migrieren + laden ━━━━━━━━
    try {
      const saved = localStorage.getItem('bl-league');
      if (saved === 'frauen') localStorage.setItem('bl-league', 'frauen1');
      if (saved === 'maenner') localStorage.setItem('bl-league', 'maenner1');
      const current = localStorage.getItem('bl-league');
      if (current && LEAGUES[current] && !LEAGUES[current].club) S.league = current;
    } catch (e) { }

    // Geteiltes Spiel aus der URL übernehmen, bevor die Daten geladen werden.
    // Die Liga wird wie beim Umschalten gespeichert.
    const shareTarget = readShareHash();
    if (shareTarget) {
      S.league = shareTarget.lk;
      S.share = { lk: shareTarget.lk, mid: shareTarget.mid, scrolled: false };
      try { localStorage.setItem('bl-league', shareTarget.lk); } catch (e) { }
    }

    // Link im bereits offenen Tab (z. B. Zurück-Button) erneut anwenden.
    window.addEventListener('hashchange', () => {
      const t = readShareHash();
      if (!t || (S.share && S.share.lk === t.lk && S.share.mid === t.mid)) return;
      applyShareTarget(t);
    });

    init();
  </script>
</body>
