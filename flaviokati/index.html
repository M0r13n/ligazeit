<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
  <meta name="referrer" content="no-referrer">
  <!-- Easter Egg: nicht in Suchmaschinen -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" id="metaThemeColor">
  <script>
    // Gleiches Design wie die Hauptseite (gleicher Speicher-Schlüssel), vor dem ersten Zeichnen.
    (function () {
      var t = null;
      try { t = localStorage.getItem('bl-theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('metaThemeColor').setAttribute('content', t === 'dark' ? '#1c1d21' : '#ffffff');
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Flavio gegen Kati – Ligazeit</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --primary: #166ee1;
      --primary-light: #e6f0fd;
      --bg: #f5f5f4;
      --surface: #fff;
      --surface-2: #fafafa;
      --border: #dcdcdc;
      --border-light: #efefef;
      --text: #1d1d1d;
      --text2: #6b6b6b;
      --text3: #9a9a9a;
      --r: 8px;
      --rs: 6px;
      --shadow: 0 1px 3px rgba(0, 0, 0, .08);
      color-scheme: light;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: #5b9cf5;
      --primary-light: rgba(91, 156, 245, .16);
      --bg: #141518;
      --surface: #1c1d21;
      --surface-2: #232429;
      --border: #34363c;
      --border-light: #2a2c31;
      --text: #ececee;
      --text2: #a8aab1;
      --text3: #7c7f87;
      --shadow: 0 1px 3px rgba(0, 0, 0, .5);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
      min-height: 100vh
    }

    .accent-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #8b5cf6)
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0
    }

    .header-left h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      flex-shrink: 0
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0
    }

    .back-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--rs);
      padding: 6px 12px;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color .15s
    }

    .back-link:hover {
      border-color: var(--primary)
    }

    .refresh-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--rs);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      flex-shrink: 0;
      transition: all .15s
    }

    .refresh-btn:hover {
      background: var(--bg);
      color: var(--text)
    }

    .back-link:focus-visible,
    .refresh-btn:focus-visible,
    .footer a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    .theme-btn svg {
      width: 16px;
      height: 16px
    }

    .theme-btn .ico-sun,
    :root[data-theme="dark"] .theme-btn .ico-moon {
      display: none
    }

    :root[data-theme="dark"] .theme-btn .ico-sun {
      display: block
    }

    .content {
      max-width: 940px;
      margin: 20px auto;
      padding: 0 24px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2)
    }

    .card-header h2 {
      font-size: 14px;
      font-weight: 600
    }

    .duel {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center
    }

    .duel th {
      padding: 18px 12px 6px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text2)
    }

    .duel td {
      padding: 4px 12px 22px;
      font-size: 40px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.5px
    }

    .duel .sep {
      width: 48px;
      color: var(--text3)
    }

    .footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text3)
    }

    .footer a {
      color: var(--primary);
      text-decoration: none
    }

    .footer a:hover {
      text-decoration: underline
    }

    @media(max-width:699px) {
      .header {
        padding: 12px 16px
      }

      .header-left h1 {
        font-size: 15px
      }

      .content {
        margin: 12px auto;
        padding: 0 12px
      }

      .duel td {
        font-size: 32px
      }
    }
  </style>
</head>

<body>
  <div class="accent-bar"></div>
  <header class="header">
    <div class="header-left">
      <h1>⚽ Flavio gegen Kati</h1>
      <span class="badge">Duell</span>
    </div>
    <div class="header-actions">
      <a class="back-link" href="/">← Ligazeit</a>
      <button class="refresh-btn theme-btn" id="btnTheme" type="button" title="Dunkles Design einschalten"
        aria-label="Dunkles Design einschalten">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main class="content">
    <div class="card">
      <div class="card-header">
        <h2>Aktueller Stand</h2>
      </div>
      <!-- Stand hier anpassen -->
      <table class="duel">
        <thead>
          <tr>
            <th scope="col">Flavio</th>
            <th scope="col" class="sep" aria-hidden="true"></th>
            <th scope="col">Kati</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>5</td>
            <td class="sep" aria-hidden="true">:</td>
            <td>4</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="footer"><a href="/">Zurück zu Ligazeit</a></footer>

  <script>
    (function () {
      var KEY = 'bl-theme';
      var btn = document.getElementById('btnTheme');
      function apply(t) {
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('metaThemeColor').setAttribute('content', t === 'dark' ? '#1c1d21' : '#ffffff');
        var label = t === 'dark' ? 'Helles Design einschalten' : 'Dunkles Design einschalten';
        btn.setAttribute('aria-label', label);
        btn.title = label;
      }
      apply(document.documentElement.getAttribute('data-theme'));
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(KEY, next); } catch (e) { }
        apply(next);
      });
    })();
  </script>
</body>

</html>
