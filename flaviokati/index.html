<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:">
  <meta name="referrer" content="no-referrer">
  <!-- Easter Egg: nicht in Suchmaschinen -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" id="metaThemeColor">
  <script>
    // Gleiches Design wie die Hauptseite (gleicher Speicher-Schlüssel), vor dem ersten Zeichnen.
    (function () {
      var t = null;
      try { t = localStorage.getItem('bl-theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('metaThemeColor').setAttribute('content', t === 'dark' ? '#1c1d21' : '#ffffff');
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Flavio gegen Kati – Ligazeit</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --primary: #166ee1;
      --primary-light: #e6f0fd;
      --bg: #f5f5f4;
      --surface: #fff;
      --surface-2: #fafafa;
      --border: #dcdcdc;
      --border-light: #efefef;
      --text: #1d1d1d;
      --text2: #6b6b6b;
      --text3: #9a9a9a;
      --r: 8px;
      --rs: 6px;
      --shadow: 0 1px 3px rgba(0, 0, 0, .08);
      color-scheme: light;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --primary: #5b9cf5;
      --primary-light: rgba(91, 156, 245, .16);
      --bg: #141518;
      --surface: #1c1d21;
      --surface-2: #232429;
      --border: #34363c;
      --border-light: #2a2c31;
      --text: #ececee;
      --text2: #a8aab1;
      --text3: #7c7f87;
      --shadow: 0 1px 3px rgba(0, 0, 0, .5);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 14px;
      min-height: 100vh
    }

    .accent-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #8b5cf6)
    }

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0
    }

    .header-left h1 {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      flex-shrink: 0
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0
    }

    .back-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--rs);
      padding: 6px 12px;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color .15s
    }

    .back-link:hover {
      border-color: var(--primary)
    }

    .refresh-btn {
      width: 34px;
      height: 34px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--rs);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      flex-shrink: 0;
      transition: all .15s
    }

    .refresh-btn:hover {
      background: var(--bg);
      color: var(--text)
    }

    .back-link:focus-visible,
    .refresh-btn:focus-visible,
    .footer a:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    .theme-btn svg {
      width: 16px;
      height: 16px
    }

    .theme-btn .ico-sun,
    :root[data-theme="dark"] .theme-btn .ico-moon {
      display: none
    }

    :root[data-theme="dark"] .theme-btn .ico-sun {
      display: block
    }

    .content {
      max-width: 940px;
      margin: 20px auto;
      padding: 0 24px
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-2)
    }

    .card-header h2 {
      font-size: 14px;
      font-weight: 600
    }

    /* Tennisball statt Emoji */
    .ball {
      width: 22px;
      height: 22px;
      flex-shrink: 0
    }

    .header-left h1 {
      display: flex;
      align-items: center;
      gap: 9px
    }

    /* Platzlinien von oben, dezent hinter dem Stand; das Netz liegt
       genau zwischen den Spalten (mittlere Spalte ist das Netz). */
    .court {
      position: relative;
      padding: 18px 20px
    }

    .court svg {
      position: absolute;
      inset: 14px 20px;
      width: calc(100% - 40px);
      height: calc(100% - 28px);
      color: var(--border);
      pointer-events: none
    }

    .court .net {
      color: var(--text3)
    }

    .duel {
      position: relative;
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      text-align: center
    }

    /* Namenszeile: 22 + 22 + 4 = 48px hoch. Die Ergebniszeile bekommt unten
       dieselben 48px (plus ihre 2px oben), damit die Zahlen genau auf der
       Mittellinie des Platzes stehen, unabhängig von der Schriftgröße. */
    .duel th {
      padding: 22px 12px 4px;
      line-height: 22px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text2)
    }

    .duel td {
      padding: 2px 12px 50px;
      font-size: 40px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.5px
    }

    .duel .sep {
      width: 48px
    }

    /* Doppelpunkt als zwei Punkte, exakt in der Platzmitte auf dem Netz.
       Ein Text-":" sitzt je nach Schrift zu tief. */
    .colon {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      margin: -11px 0 0 -3px;
      border-radius: 50%;
      background: var(--text3);
      box-shadow: 0 16px 0 var(--text3);
      pointer-events: none
    }

    /* Fliegende Bälle (Klick auf "Flavio") */
    .flying-ball {
      position: fixed;
      top: 0;
      left: 0;
      width: 56px;
      height: 56px;
      z-index: 200;
      cursor: pointer;
      will-change: transform;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .25))
    }

    .flying-ball.fade {
      transition: opacity .6s ease;
      opacity: 0
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap
    }

    .footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text3)
    }

    .footer a {
      color: var(--primary);
      text-decoration: none
    }

    .footer a:hover {
      text-decoration: underline
    }

    @media(max-width:699px) {
      .header {
        padding: 12px 16px
      }

      .header-left h1 {
        font-size: 15px
      }

      .content {
        margin: 12px auto;
        padding: 0 12px
      }

      .duel td {
        font-size: 32px
      }
    }
  </style>
</head>

<body>
  <div class="accent-bar"></div>
  <header class="header">
    <div class="header-left">
      <h1><svg class="ball" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10.5" fill="#d4e43f" stroke="#a9b82a" stroke-width="1" />
          <path d="M4.2 5.2c3.6 2.9 3.6 10.7 0 13.6M19.8 5.2c-3.6 2.9-3.6 10.7 0 13.6" fill="none" stroke="#fff"
            stroke-width="1.6" stroke-linecap="round" />
        </svg>Flavio gegen Kati</h1>
      <span class="badge">Duell</span>
    </div>
    <div class="header-actions">
      <a class="back-link" href="/">← Ligazeit</a>
      <button class="refresh-btn theme-btn" id="btnTheme" type="button" title="Dunkles Design einschalten"
        aria-label="Dunkles Design einschalten">
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
    </div>
  </header>

  <main class="content">
    <div class="card">
      <div class="card-header">
        <h2>Aktueller Stand</h2>
      </div>
      <div class="court">
        <svg viewBox="0 0 2377 1097" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke">
            <rect x="0" y="0" width="2377" height="1097" vector-effect="non-scaling-stroke" />
            <path d="M0 137H2377M0 960H2377M548.5 137V960M1828.5 137V960M548.5 548.5H1828.5M0 548.5H40M2337 548.5H2377"
              vector-effect="non-scaling-stroke" />
          </g>
          <path class="net" d="M1188.5 0V1097" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"
            vector-effect="non-scaling-stroke" />
        </svg>
        <span class="colon" aria-hidden="true"></span>
      <!-- Stand hier anpassen -->
      <table class="duel">
        <thead>
          <tr>
            <th scope="col" id="flavio">Flavio</th>
            <th scope="col" class="sep" aria-hidden="true"></th>
            <th scope="col">Kati</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>5</td>
            <td class="sep"><span class="visually-hidden">:</span></td>
            <td>4</td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
  </main>

  <footer class="footer"><a href="/">Zurück zu Ligazeit</a></footer>

  <!-- Vorlage für die fliegenden Bälle -->
  <template id="ballTpl">
    <svg class="flying-ball" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="10.5" fill="#d4e43f" stroke="#a9b82a" stroke-width="1" />
      <path d="M4.2 5.2c3.6 2.9 3.6 10.7 0 13.6M19.8 5.2c-3.6 2.9-3.6 10.7 0 13.6" fill="none" stroke="#fff"
        stroke-width="1.6" stroke-linecap="round" />
    </svg>
  </template>

  <script>
    // Easter Egg im Easter Egg: Klick auf "Flavio" schickt einen Tennisball
    // wie das alte DVD-Logo über die Seite. Klick auf den Ball oder Escape beendet.
    (function () {
      var MAX_BALLS = 10, SPEED = 260, SIZE = 56;   // px/s, px
      var balls = [], running = false, last = 0;
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var tpl = document.getElementById('ballTpl');

      function makeBall() {
        var el = tpl.content.firstElementChild.cloneNode(true);
        document.body.appendChild(el);
        return el;
      }

      function remove(b) {
        balls = balls.filter(function (x) { return x !== b; });
        b.el.classList.add('fade');
        setTimeout(function () { b.el.remove(); }, 600);
      }

      function draw(b) {
        var sq = b.squash > 0 ? 1 - 0.18 * b.squash : 1;     // kurz stauchen nach dem Aufprall
        var sx = b.squashAxis === 'x' ? sq : 2 - sq, sy = b.squashAxis === 'x' ? 2 - sq : sq;
        b.el.style.transform = 'translate(' + b.x + 'px,' + b.y + 'px) rotate(' + b.rot + 'deg) scale(' + sx + ',' + sy + ')';
      }

      function step(t) {
        var dt = Math.min((t - last) / 1000, 0.05);
        last = t;
        var w = window.innerWidth - SIZE, h = window.innerHeight - SIZE;
        balls.forEach(function (b) {
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.x <= 0 || b.x >= w) { b.vx = -b.vx; b.x = Math.max(0, Math.min(w, b.x)); b.squash = 1; b.squashAxis = 'x'; }
          if (b.y <= 0 || b.y >= h) { b.vy = -b.vy; b.y = Math.max(0, Math.min(h, b.y)); b.squash = 1; b.squashAxis = 'y'; }
          b.squash = Math.max(0, b.squash - dt * 6);
          b.rot += (b.vx > 0 ? 1 : -1) * SPEED * dt * 360 / (Math.PI * SIZE);   // rollt passend zur Strecke
          draw(b);
        });
        if (balls.length) requestAnimationFrame(step); else running = false;
      }

      function launch(fromEl) {
        if (reduceMotion) {                     // ohne Animation: kurz zeigen, dann ausblenden
          var el = makeBall();
          el.style.transform = 'translate(' + (window.innerWidth - SIZE) / 2 + 'px,' + (window.innerHeight - SIZE) / 2 + 'px)';
          setTimeout(function () { el.classList.add('fade'); setTimeout(function () { el.remove(); }, 600); }, 1500);
          return;
        }
        if (balls.length >= MAX_BALLS) return;
        var r = fromEl.getBoundingClientRect();
        var angle = (0.2 + Math.random() * 0.35) * Math.PI;   // schräg, nie ganz waagerecht oder senkrecht
        var b = {
          el: makeBall(),
          x: Math.max(0, Math.min(window.innerWidth - SIZE, r.left + r.width / 2 - SIZE / 2)),
          y: Math.max(0, Math.min(window.innerHeight - SIZE, r.top + r.height / 2 - SIZE / 2)),
          vx: SPEED * Math.cos(angle) * (Math.random() < .5 ? -1 : 1),
          vy: -SPEED * Math.sin(angle),
          rot: 0, squash: 0, squashAxis: 'x'
        };
        b.el.addEventListener('click', function () { remove(b); });
        balls.push(b);
        draw(b);
        if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); }
      }

      document.getElementById('flavio').addEventListener('click', function (e) { launch(e.currentTarget); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') balls.slice().forEach(remove);
      });
    })();

    (function () {
      var KEY = 'bl-theme';
      var btn = document.getElementById('btnTheme');
      function apply(t) {
        document.documentElement.setAttribute('data-theme', t);
        document.getElementById('metaThemeColor').setAttribute('content', t === 'dark' ? '#1c1d21' : '#ffffff');
        var label = t === 'dark' ? 'Helles Design einschalten' : 'Dunkles Design einschalten';
        btn.setAttribute('aria-label', label);
        btn.title = label;
      }
      apply(document.documentElement.getAttribute('data-theme'));
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem(KEY, next); } catch (e) { }
        apply(next);
      });
    })();
  </script>
</body>

</html>
